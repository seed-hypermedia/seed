captainVersion: 4
services:
    $$cap_appname:
        image: caddy:2.10.2
        depends_on:
            - $$cap_appname-daemon
            - $$cap_appname-web
        environment:
            CADDYFILE: |-
                {
                  admin off
                  auto_https off
                  servers {
                    trusted_proxies static private_ranges
                  }
                }
                :80 {
                  encode zstd gzip
                  reverse_proxy /ipfs/* srv-captain--$$cap_appname-daemon:56001
                  reverse_proxy * srv-captain--$$cap_appname-web:3000
                }
        command:
            - sh
            - -c
            - 'printf "%s\n" "$CADDYFILE" > /etc/caddy/Caddyfile && exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile'

    $$cap_appname-daemon:
        image: $$cap_site_image
        caproverExtra:
            notExposeAsWebApp: 'true'
        ports:
            - '$$cap_p2p_port:56000'
        volumes:
            - $$cap_appname-daemon-data:/data
            - $$cap_appname-web-data:/web
        environment:
            SEED_LINK_SECRET: $$cap_link_secret
            SEED_LOG_LEVEL: info
            LIGHTNING_API_URL: https://ln.seed.hyper.media
            SENTRY_DSN: https://47c66bd7a6d64db68a59c03f2337e475@o4504088793841664.ingest.sentry.io/4505527493328896
        command:
            - sh
            - -c
            - |-
                [ -f /web/config.json ] || printf '{"availableRegistrationSecret":"%s"}\n' "$SEED_LINK_SECRET" > /web/config.json
                chown -R 1001:1001 /web
                exec seed-daemon -data-dir=/data -keystore-dir=/data/keys -lndhub.mainnet -p2p.port=56000 -http.port=56001 -grpc.port=56002 -p2p.no-relay=true -p2p.force-reachability-public=true -syncing.smart=true -syncing.no-sync-back=true -p2p.announce-addrs=/dns4/$$cap_seed_domain/tcp/$$cap_p2p_port,/dns4/$$cap_seed_domain/udp/$$cap_p2p_port/quic-v1

    $$cap_appname-web:
        image: $$cap_web_image
        caproverExtra:
            notExposeAsWebApp: 'true'
        depends_on:
            - $$cap_appname-daemon
        volumes:
            - $$cap_appname-web-data:/data
        environment:
            SEED_BASE_URL: https://$$cap_seed_domain
            SEED_ASSET_HOST: https://$$cap_seed_domain
            DAEMON_HTTP_URL: http://srv-captain--$$cap_appname-daemon:56001
            NOTIFY_SERVICE_HOST: https://notify.seed.hyper.media
            SEED_IS_GATEWAY: 'false'
            SEED_ENABLE_STATISTICS: 'false'
            PORT: '3000'
            DATA_DIR: /data
        command:
            - sh
            - -c
            - 'until [ -f /data/config.json ]; do sleep 1; done; exec npm run start:prod'

    $$cap_appname-updater:
        image: containrrr/shepherd:v1.8.1
        caproverExtra:
            notExposeAsWebApp: 'true'
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock
        environment:
            SLEEP_TIME: $$cap_update_interval
            FILTER_SERVICES: name=$$cap_appname-
            IGNORELIST_SERVICES: $$cap_appname-updater
            ROLLBACK_ON_FAILURE: 'true'

caproverOneClickApp:
    variables:
        - id: $$cap_seed_domain
          label: Site domain
          defaultValue: $$cap_appname.$$cap_root_domain
          description: Public hostname used by Seed and daemon announce addresses.
          validRegex: '/^[A-Za-z0-9.-]+$/'
        - id: $$cap_p2p_port
          label: P2P host port
          defaultValue: '56000'
          description: Unique host port for libp2p TCP and QUIC/UDP.
          validRegex: '/^([1-9]|[1-9][0-9]{1,3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5])$/'
        - id: $$cap_link_secret
          label: Registration link secret
          defaultValue: $$cap_gen_random_hex(32)
          description: Secret included in the registration URL.
          validRegex: '/^[a-fA-F0-9]{32}$/'
        - id: $$cap_web_image
          label: Seed web image
          defaultValue: seedhypermedia/web:latest
          description: Override this to use a different Seed web image.
          validRegex: '/^\S+$/'
        - id: $$cap_site_image
          label: Seed daemon image
          defaultValue: seedhypermedia/site:latest
          description: Override this to use a different Seed daemon image.
          validRegex: '/^\S+$/'
        - id: $$cap_update_interval
          label: Update interval
          defaultValue: 10m
          description: Shepherd polling interval, for example 10m.
          validRegex: '/^[1-9][0-9]*(ms|s|m|h)$/'
    instructions:
        start: >-
            Deploys one Seed Hypermedia site with a daemon, web app, Caddy proxy for /ipfs traffic, and Shepherd updates.
            Choose a P2P host port that is unique per site and open for both TCP and UDP.
        end: |-
            Enable HTTPS and Force HTTPS for the `$$cap_appname` app in CapRover. If you use a custom domain, add it to that
            app and set Site domain (`$$cap_seed_domain`) to the same hostname.

            Open `$$cap_p2p_port` on the server firewall for both TCP and UDP.

            Register from Seed desktop at:
            https://$$cap_seed_domain/hm/register?secret=$$cap_link_secret
    displayName: Seed Hypermedia
    isOfficial: false
    description: Self-host one Seed Hypermedia site with P2P, HTTPS, persistent data, and scoped automatic updates.
    documentation: https://seed.hyper.media
