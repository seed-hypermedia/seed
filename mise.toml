min_version = "2025.12.12"

[tools]
"conda:coreutils" = "9.5"
go = "1.27.1"
"go:github.com/thought-machine/please/src" = {"version" = "648d330599c4a96e46ec7aa9bca5839119b04a4c", postinstall = "mv $MISE_TOOL_INSTALL_PATH/bin/src $MISE_TOOL_INSTALL_PATH/bin/plz"}
node = "22.22.0"
protoc = "24.4"
pnpm = "10.32.0"
cmake = "3.31.6"
golangci-lint = "2.13.2"
bun = "1.3.10"
# Process multiplexer for the unified dev stack (`./dev up`); one pane per process.
"aqua:pvolok/mprocs" = "0.9.6"

[settings]
experimental = true
always_keep_download = true
cache_prune_age = "180d"
http_retries = 3
fetch_remote_versions_cache = "24h"

[env]
_.file = ".env"

# GPU acceleration for llama.cpp:
# - macOS: Metal (built-in, no extra packages needed)
# - Linux: CPU-only for local dev (Vulkan used in CI/production only)
#
# If you need Vulkan on Linux for local GPU testing:
#   Fedora/RHEL: sudo dnf install vulkan-headers vulkan-loader-devel glslang gcc-c++
#   Ubuntu/Debian: sudo apt install libvulkan-dev vulkan-tools glslc g++

[tasks.ensure-submodule]
run = '''
if [ -f .gitmodules ] && { [ ! -f backend/util/llama-go/Makefile ] || [ ! -f backend/util/llama-go/llama.cpp/CMakeLists.txt ]; }; then
  echo "Initializing git submodules (llama-go + llama.cpp)..."
  COMMON_GIT_DIR=$(git rev-parse --path-format=absolute --git-common-dir)
  LLAMA_GIT_DIR="$COMMON_GIT_DIR/modules/backend/util/llama-go"
  if [ ! -d "$LLAMA_GIT_DIR" ]; then
    # Bare repositories keep submodule storage under the worktree that initialized it.
    MAIN_WORKTREE=$(sh scripts/find-worktree-file.sh backend/util/llama-go/llama.cpp/CMakeLists.txt)
    if [ -n "$MAIN_WORKTREE" ]; then
      LLAMA_GIT_DIR=$(git -C "$MAIN_WORKTREE" rev-parse --path-format=absolute --git-path modules/backend/util/llama-go)
    fi
  fi

  init_submodule() {
    repo=$1
    path=$2
    cache=$3
    revision=$(git -C "$repo" rev-parse ":$path")
    if git --git-dir="$cache" cat-file -e "$revision^{commit}" 2>/dev/null; then
      url=$(git -C "$repo" config -f .gitmodules --get "submodule.$path.url")
      # Local clones hardlink objects and retain the upstream URL for later fetches.
      git -C "$repo" -c protocol.file.allow=always \
        -c "url.$cache.insteadOf=$url" submodule update --init -- "$path"
    else
      git -C "$repo" submodule update --init --depth=1 -- "$path"
    fi
  }

  init_submodule . backend/util/llama-go "$LLAMA_GIT_DIR"
  init_submodule backend/util/llama-go llama.cpp "$LLAMA_GIT_DIR/modules/llama.cpp"
fi
'''
hide = true

[tasks.ensure-model]
run = '''
MODEL="backend/llm/backends/llamacpp/models/granite-embedding-107m-multilingual-Q8_0.gguf"
if [ ! -f "$MODEL" ]; then
  mkdir -p "$(dirname "$MODEL")"
  MAIN_WORKTREE=$(sh scripts/find-worktree-file.sh "$MODEL")
  if [ -f "$MAIN_WORKTREE/$MODEL" ]; then
    echo "Reusing GGUF embedding model from main worktree..."
    cp "$MAIN_WORKTREE/$MODEL" "$MODEL"
  else
    echo "Downloading GGUF embedding model..."
    curl -fSL --progress-bar -o "$MODEL" \
      "https://huggingface.co/keisuke-miyako/granite-embedding-107m-multilingual-gguf-q8_0/resolve/main/granite-embedding-107m-multilingual-Q8_0.gguf?download=true"
  fi
fi
'''
hide = true

[tasks.ensure-llama-libs]
depends = ["ensure-submodule"]
run = '''
LLAMA_GO_DIR="backend/util/llama-go"
NEEDS_BUILD=false

# Copy only finished libraries, keeping each worktree's sources and builds independent.
if [ ! -f "$LLAMA_GO_DIR/libbinding.a" ]; then
  MAIN_WORKTREE=$(sh scripts/find-worktree-file.sh "$LLAMA_GO_DIR/libbinding.a")
  MAIN_LLAMA_GO_DIR="$MAIN_WORKTREE/$LLAMA_GO_DIR"
  if [ -f "$MAIN_LLAMA_GO_DIR/libbinding.a" ] && \
     [ "$(git -C "$MAIN_LLAMA_GO_DIR" rev-parse HEAD)" = "$(git -C "$LLAMA_GO_DIR" rev-parse HEAD)" ]; then
    echo "Reusing llama.cpp libraries from main worktree..."
    cp "$MAIN_LLAMA_GO_DIR/"*.a "$LLAMA_GO_DIR/"
    if [ -f "$MAIN_LLAMA_GO_DIR/ggml-metal.metal" ]; then
      cp "$MAIN_LLAMA_GO_DIR/ggml-metal.metal" "$LLAMA_GO_DIR/"
    fi
  fi
fi

if [ ! -f "$LLAMA_GO_DIR/libbinding.a" ]; then
  NEEDS_BUILD=true
elif [ "$(uname -s)" = "Darwin" ] && [ ! -f "$LLAMA_GO_DIR/libggml-blas.a" ]; then
  # macOS requires Metal build. libggml-blas.a only exists after a Metal build.
  # If missing, a stale CPU-only build exists and must be replaced.
  NEEDS_BUILD=true
fi

if [ "$NEEDS_BUILD" = "true" ]; then
  cd "$LLAMA_GO_DIR"
  if [ "$(uname -s)" = "Darwin" ]; then
    echo "Building llama.cpp libraries with Metal (this may take a few minutes)..."
    BUILD_TYPE=metal CMAKE_ARGS="-DBUILD_SHARED_LIBS=OFF -DGGML_OPENMP=OFF" make libbinding.a
    cp build/bin/ggml-metal.metal . 2>/dev/null || true
    # Stub for Vulkan (not used on macOS).
    touch libggml-vulkan.a
  else
    echo "Building llama.cpp libraries, CPU-only (this may take a few minutes)..."
    CMAKE_ARGS="-DBUILD_SHARED_LIBS=OFF -DGGML_VULKAN=OFF -DGGML_METAL=OFF -DGGML_CUDA=OFF -DGGML_HIP=OFF -DGGML_SYCL=OFF -DGGML_BLAS=OFF" make libbinding.a
    # Stubs for GPU libraries (not used in CPU-only build, but needed for linking).
    touch libggml-vulkan.a
    touch libggml-metal.a
  fi
  echo "llama.cpp libraries built successfully."
fi
'''
hide = true

[tasks.check-gpu]
description = "Check if GPU acceleration dependencies are installed for your platform"
run = '''
if [ "$(uname -s)" = "Darwin" ]; then
  echo "macOS: Metal support is built-in and always enabled"
else
  echo "Linux: local dev uses CPU-only builds. Vulkan is used in CI/production."
  echo ""
  echo "To check Vulkan availability (optional):"
  if command -v glslc >/dev/null 2>&1; then
    echo "  glslc: found"
  else
    echo "  glslc: not found (install: sudo dnf install glslang / sudo apt install glslc)"
  fi
  if pkg-config --exists vulkan 2>/dev/null; then
    echo "  vulkan: found"
  else
    echo "  vulkan: not found (install: sudo dnf install vulkan-headers vulkan-loader-devel)"
  fi
fi
'''
