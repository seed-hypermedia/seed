name: Mobile - EAS Update (OTA)

# Publishes an over-the-air JS update to the production channel on every push
# to main that touches the mobile app or the shared packages it bundles.
# Installed apps (TestFlight and App Store) pick it up on next launch — no
# store submission involved. Native changes (new pods, SDK upgrades, app.json
# native config) still need a full build: run the "Mobile - EAS Build &
# Submit" workflow for those.

on:
  push:
    branches: [main]
    paths:
      - "frontend/apps/mobile/**"
      - "frontend/packages/client/**"
      - "frontend/packages/shared/**"
      - "frontend/packages/ui/src/agents/**"
      - "agents/protocol/**"
      - ".github/workflows/mobile-eas-update.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.18.0
          cache: npm
          cache-dependency-path: frontend/apps/mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Publish EAS Update
        run: npx eas-cli update --channel production --auto --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_NO_METRO_WORKSPACE_ROOT: "1"
