name: Agents UI package

# @seed-hypermedia/agents-ui bundles the agents UI (frontend/packages/ui/src/agents), the agents
# protocol and Seed's editor for apps outside this repository. Every change to them is validated
# against the packed package; changes on main publish automatically, like the client and CLI.

on:
  pull_request:
    paths:
      - 'frontend/packages/agents-ui/**'
      - 'frontend/packages/ui/**'
      - 'frontend/packages/shared/**'
      - 'frontend/packages/client/**'
      - 'frontend/packages/editor/**'
      - 'agents/protocol/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'mise.toml'
      - '.github/workflows/agents-ui.yml'
  push:
    branches: [main]
    paths:
      - 'frontend/packages/agents-ui/**'
      - 'frontend/packages/ui/**'
      - 'frontend/packages/shared/**'
      - 'frontend/packages/client/**'
      - 'frontend/packages/editor/**'
      - 'agents/protocol/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'mise.toml'
      - '.github/workflows/agents-ui.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agents-ui-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # Keep versions aligned with mise.toml and package.json#packageManager.
      - uses: pnpm/action-setup@v4
        with:
          version: '10.32.0'

      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Check formatting and types
        run: |
          pnpm --filter @seed-hypermedia/agents-ui format:check
          pnpm --filter @seed-hypermedia/agents-ui typecheck

      - name: Test
        run: pnpm --filter @seed-hypermedia/agents-ui test

      # Match the client/CLI release policy: honor intentional bumps, otherwise increment npm's patch.
      # Select the version before building so the validated tarball is exactly what gets published.
      - name: Determine version
        if: >-
          github.ref == 'refs/heads/main' && github.repository == 'seed-hypermedia/seed' && (github.event_name == 'push'
          || github.event_name == 'workflow_dispatch')
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import {readFileSync, writeFileSync} from 'node:fs'
          const file = 'frontend/packages/agents-ui/package.json'
          const pkg = JSON.parse(readFileSync(file, 'utf8'))
          const response = await fetch(`https://registry.npmjs.org/${encodeURIComponent(pkg.name)}/latest`)
          let version = pkg.version
          if (response.status !== 404) {
            assert.ok(response.ok, `npm registry returned HTTP ${response.status}`)
            const published = (await response.json()).version
            const parse = (value) => {
              assert.match(value, /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/, 'Expected a stable package version')
              return value.split('.').map(Number)
            }
            const local = parse(pkg.version)
            const remote = parse(published)
            const firstDifference = local.findIndex((part, index) => part !== remote[index])
            if (firstDifference === -1 || local[firstDifference] < remote[firstDifference]) {
              version = `${remote[0]}.${remote[1]}.${remote[2] + 1}`
            }
          }
          pkg.version = version
          writeFileSync(file, JSON.stringify(pkg, null, 2) + '\n')
          console.log(`Publishing ${pkg.name}@${version}`)
          NODE

      - name: Build and check the packed package in a clean npm consumer
        env:
          AGENTS_UI_PACKAGE_ARTIFACT_DIR: ${{ runner.temp }}/agents-ui-package
        run: pnpm --filter @seed-hypermedia/agents-ui test:package:install

      - uses: actions/upload-artifact@v4
        with:
          name: agents-ui-${{ github.sha }}
          path: ${{ runner.temp }}/agents-ui-package/*.tgz
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: validate
    if:
      github.ref == 'refs/heads/main' && github.repository == 'seed-hypermedia/seed' && (github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@v4
        with:
          name: agents-ui-${{ github.sha }}
          path: agents-ui-package

      # Trusted publishing (OIDC), like @seed-hypermedia/client. npm only lets an owner of the
      # @seed-hypermedia scope add this repository as the package's trusted publisher once the
      # package exists, so the first release is published by hand from the artifact above.
      - name: Publish the validated tarball
        run: |
          set -euo pipefail
          packages=(./agents-ui-package/*.tgz)
          if [ "${#packages[@]}" -ne 1 ] || [ ! -f "${packages[0]}" ]; then
            echo 'Expected exactly one validated package tarball.' >&2
            exit 1
          fi
          npm publish "${packages[0]}" --access public --provenance --ignore-scripts
