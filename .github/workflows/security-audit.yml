name: Security Audit

on:
  push:
    branches:
      - main
    paths:
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'patches/**'
      - 'scripts/security/**'
      - '.github/workflows/security-audit.yml'
  pull_request:
    paths:
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'patches/**'
      - 'scripts/security/**'
      - '.github/workflows/security-audit.yml'
  schedule:
    # Run every Monday at 09:00 UTC to catch newly-reported vulnerabilities
    # in existing dependencies even when no code changes are made.
    - cron: '0 9 * * 1'

jobs:
  audit:
    name: pnpm audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # The registry cannot inspect local patches. Exercise their actual installed
      # behavior before accepting any advisory exception for a patched dependency.
      - name: Install dependencies with local security patches
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify patched dependencies
        run: node --test scripts/security/*.test.cjs

      - name: Run security audit
        # Fail on high or critical vulnerabilities.
        # Use --audit-level=moderate to be stricter if desired.
        # --ignore-registry-errors: npm is retiring legacy audit endpoints
        # (pnpm/pnpm#11265) — don't fail the build when the registry is down.
        run: pnpm audit --audit-level=high --ignore-registry-errors
