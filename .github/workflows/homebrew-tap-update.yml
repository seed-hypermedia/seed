name: Homebrew Tap Update

# Notifies seed-hypermedia/homebrew-tap that a new desktop release is live so
# it can bump the `seed` cask immediately. `types: [released]` fires when a
# release is published as a full release or a prerelease is promoted to one
# (the `gh release edit --prerelease=false --latest` step of the release
# process), so Homebrew only ever sees promoted releases.
#
# The dispatch is best-effort: the tap also polls on a schedule (every 6
# hours), so a missing HOMEBREW_TAP_TOKEN or a failed dispatch only delays the
# bump, it doesn't lose it.

on:
  release:
    types: [released]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger tap update
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::notice::HOMEBREW_TAP_TOKEN is not set; skipping immediate Homebrew bump. The tap's scheduled update will pick this release up within 6 hours."
            exit 0
          fi
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TAP_TOKEN" \
            https://api.github.com/repos/seed-hypermedia/homebrew-tap/dispatches \
            -d '{"event_type":"seed-release"}'
