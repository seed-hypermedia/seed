name: Repo HM sync (hypermedia)

# Publishes hypermedia/ (developer docs, the Hypermedia schema library, agents docs)
# to the Seed developer docs site, staging.hyper.media, whenever main changes it.
# Signs with SEED_DOCS_STAGING_KEYFILE (a repository secret holding the contents
# of an unencrypted .hmkey.json, as the daemon exports it): the site is that key's
# own space, hm://z6MkkW8Uh77G79XMED3KLFiSqoYMqSF63fJMLEiYBNpF9xnL, and the push goes
# through the staging gateway, which holds the site's own documents. Documents are
# updated block by block; unchanged pages publish nothing.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'hypermedia/**'
      - '.github/workflows/sync-hypermedia.yml'

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check hypermedia/ is consistent
        run: node scripts/hypermedia/check.mjs
      - name: Publish hypermedia/ to staging.hyper.media
        working-directory: frontend/apps/cli
        env:
          SEED_CLI_KEYFILE: ${{ secrets.SEED_DOCS_STAGING_KEYFILE }}
        run: |
          if [ -z "$SEED_CLI_KEYFILE" ]; then
            echo "SEED_DOCS_STAGING_KEYFILE secret is not set; skipping publish."
            exit 0
          fi
          bun run src/sync-hypermedia.ts push --server https://staging.hyper.media
