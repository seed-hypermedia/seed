packages:
  - 'frontend/apps/*'
  # The mobile app manages its own dependencies with npm (see its README):
  # React Native needs react 19 while the root pnpm overrides pin react 18.
  - '!frontend/apps/mobile'
  - 'frontend/packages/*'
  - 'frontend/scripts'
  - 'apps/protocol'
  - 'docs'
  - 'tests'

# Supply-chain security settings — https://pnpm.io/supply-chain-security

# Delays installation of newly-published package versions by 24 h. This gives
# the security ecosystem time to detect compromised releases before they reach
# the project. Only affects `pnpm add` / version updates; `pnpm install` from
# an existing lockfile (frozen) is unaffected.
minimumReleaseAge: 1440

auditConfig:
  ignoreGhsas:
    # deepmerge has no released fix. Patch both inputs against prototype poisoning;
    # security CI verifies CJS and UMD in deepmerge-prototype.test.cjs.
    - GHSA-gcqx-w48m-w2h4
    # Backport upstream bounds to minimatch 7-10 and abort guards to glob 9-13.
    # Legacy minimatch 3/5 has no affected preprocessing implementation.
    # Security CI checks every installed version in glob-bounds.test.cjs.
    - GHSA-g3hv-75wg-m249
    - GHSA-3g3m-2fjr-6pw4
    # Tiptap 3.30.4 fix backported to our pinned Tiptap 2 package.
    # Security CI verifies CJS/ESM behavior in tiptap-merge-attributes.test.cjs.
    - GHSA-cp6q-959q-f8rh
    # braces has no released fix for recursive AST exhaustion. The pinned 3.0.3
    # dependency is patched locally with parse/walker depth limits; security CI
    # exercises the installed patch in scripts/security/braces-depth.test.cjs.
    - GHSA-vfj7-8cjw-p6xm
    # The CNA rejected this sprintf-js CVE (CVE-2026-97058); GitHub still lists the
    # withdrawn advisory. https://cveawg.mitre.org/api/cve/CVE-2026-97058
    - GHSA-hp3w-g68c-fv3c
    # Remix 2 is coupled to React Router 6, which has no patched release
    # (CVE-2026-53666, CVE-2026-53669). The notify app cannot move to React
    # Router 7 independently of Remix.
    - GHSA-337j-9hxr-rhxg
    - GHSA-wrjc-x8rr-h8h6
# trustPolicy: "no-downgrade"
# Blocks installation if a package's trust level has decreased compared to its
# previous release (e.g. was provenance-attested, now unsigned).
# DISABLED: too many packages in the current dependency tree have legitimately
# changed their publishing workflow (e.g. semver, vite, hosted-git-info,
# undici-types) — pnpm flags these as trust downgrades even when they are not
# supply-chain incidents. Re-enable once the dep tree stabilises or when pnpm
# adds a way to bulk-accept historical workflow changes.

# blockExoticSubdeps
# Prevents transitive dependencies from being resolved from exotic sources
# (git repositories, direct tarball URLs). Set explicitly to false below.

# TypeScript settings — https://pnpm.io/typescript
#
# @types/* version pinning
# In a pnpm workspace, multiple packages can end up pulling different versions of
# the same @types/* package (e.g. @types/react), causing TypeScript to fail to
# resolve types correctly. The recommended fix is either:
#   (a) packageExtensions — declare the missing peerDependency on the culprit package, or
#   (b) @pnpm/plugin-types-fixer — automates option (a) across the workspace
# We use approach (c): the `overrides` map at the bottom of this file pins @types/react
# and @types/react-dom workspace-wide. This is a valid alternative and keeps all packages
# on a single, consistent set of type definitions.
# Pinned versions: @types/react@18.2.64, @types/react-dom@18.2.21 (see `overrides` below).
#
# preserveSymlinks
# Never set "preserveSymlinks": true in any tsconfig.json when using pnpm.
# TypeScript cannot resolve type dependencies correctly through pnpm's symlinked
# node_modules with that option enabled. If you ever need symlink preservation for
# Node.js runtime behaviour, set pnpm's nodeLinker to "hoisted" instead.

# ── Settings moved here from .npmrc and package.json#pnpm for pnpm 11 ──────────
# pnpm 11 reads only auth/registry settings from .npmrc and no longer reads the
# `pnpm` field in package.json; everything project-level lives in this file.

# Node modules layout (was .npmrc node-linker / shamefully-hoist).
nodeLinker: hoisted
shamefullyHoist: true
strictPeerDependencies: false
autoInstallPeers: false

# blockExoticSubdeps defaults to true in pnpm 11. Keep it off for now:
# @electron/node-gyp is resolved from a git repo as a transitive dep of
# @electron-forge/shared-types → @electron/rebuild@3.7.2. Needs an upstream
# fix in @electron-forge before this can be enabled.
blockExoticSubdeps: false

# Lifecycle scripts run only for the packages listed here (was onlyBuiltDependencies).
# pnpm 11 fails the install for any package with build scripts that is not
# listed, so the packages whose scripts we deliberately skip are listed as false.
allowBuilds:
  '@sentry-internal/node-cpu-profiler': false
  'core-js': false
  'msw': false
  '@ipshipyard/node-datachannel': true
  '@sentry/cli': true
  '@sentry/profiling-node': true
  'better-sqlite3': true
  'canvas': true
  'electron': true
  'electron-winstaller': true
  'esbuild': true
  'fs-xattr': true
  'macos-alias': true
  'sharp': true

